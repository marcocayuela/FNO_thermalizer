########### EMULATOR (KS equation, nu=0.35) #############
seed: 42
device: cuda

# Experiment -- 1D Kuramoto-Sivashinsky field (cf. fno/fno_1D.py,
# training/fno_training_1d.py), single low-viscosity case nu=0.35. Data
# generated by KS_equation/1-D_periodic_Kuramoto_Sivashinsky_equation/
# generate_ks_dataset.py (h5 key "state", not "velocity_field" -- 1D
# convention, cf. that script's docstring).
exp_dir: KS_equation/nu0p35
input_dim: 1
output_dim: 1
n_dim: 1
domain_size:
  - 22
ratio: 1
k_max: 32
l: 1

# Model parameters -- same width/depth/hidden_proj/layers_mlp as the 2D
# Kolmogorov template (config_command_emul.yaml), only k_max_x/k_max_y ->
# k_max (a single spatial axis).
n_fourier_layer: 3
width: 32
hidden_proj: 64
mlp: true
layers_mlp: [32,64,32]
tau: 0.00001


# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 128
num_workers: 2
loss_fn: mse
optimizer:
  type: adam
  lr: 0.001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001
metrics:
  - rmse
  - mae
  - relative_rmse
  - relative_mae

train_frac: 0.7
test_frac: 0.1
stride: 5
ds: 1


#
exp_name: fno_ks_nu0p35
name_weigths_to_load: null
