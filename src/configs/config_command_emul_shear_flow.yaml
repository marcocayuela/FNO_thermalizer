########### EMULATOR (shear_flow) #############
seed: 42
device: cuda

# Experiment -- one fixed (Reynolds, Schmidt) config, cf.
# scripts/prepare_shear_flow_dataset.py. Fields: tracer, pressure, u, v (4ch).
exp_dir: shear_flow/Re5e4_Sc1e0
input_dim: 4
output_dim: 4
n_dim: 2
domain_size:
  - 1
  - 1
ratio: 1
k_max_x: 32
k_max_y: 32
l: 1

# Model parameters
n_fourier_layer: 3
width: 32
hidden_proj: 64
mlp: true
layers_mlp: [32,64,32]
tau: 0.00001


# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 64
num_workers: 2
loss_fn: mse
optimizer:
  type: adam
  lr: 0.001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001
metrics:
  - rmse
  - mae
  - relative_rmse # relative rmse
  - relative_mae # relative l1 norm

train_frac: 0.6
test_frac: 0.1
stride: 5
# Already downsampled 256x512 -> 128x256 at fetch time
# (prepare_shear_flow_dataset.py --ds 2) -- no further downsampling here.
ds: 1


#
exp_name: exp_shear_flow_Re5e4_Sc1e0
name_weigths_to_load: null
