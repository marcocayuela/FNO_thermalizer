########### EMULATOR (shear_flow) #############
seed: 42
device: cuda

# Experiment -- one fixed (Reynolds, Schmidt) config, cf.
# scripts/prepare_shear_flow_dataset.py. Fields: tracer, pressure, u, v (4ch).
exp_dir: shear_flow/Re5e4_Sc1e0
input_dim: 4
output_dim: 4
n_dim: 2
domain_size:
  - 1
  - 1
ratio: 1
# Grid is 128x256 (H x W, 1:2 aspect after ds=2 downsampling at fetch time),
# so equal k_max_x/k_max_y covers different Nyquist fractions per axis
# (24/64=37.5% in x, 24/128=18.75% in y) -- accepted trade-off to keep the
# mode count itself capped at 24 rather than matching the aspect ratio.
k_max_x: 24
k_max_y: 24
l: 1

# No domain padding (FNO2D's padding=0 default, never overridden by
# fno_training.py) -- correct here since shear_flow is periodic in both x
# and y (boundary_conditions/{x,y}_periodic in the source HDF5), same
# assumption FNO2D's plain spectral convolution already makes.

# Model parameters -- width set to keep total params ~2M given the modes
# above (param count scales with width^2 * k_max_x * k_max_y).
n_fourier_layer: 3
width: 24
hidden_proj: 64
mlp: true
layers_mlp: [24,48,24]
tau: 0.00001


# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 64
num_workers: 2
loss_fn: mse
optimizer:
  type: adam
  lr: 0.003
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001
metrics:
  - rmse
  - mae
  - relative_rmse # relative rmse
  - relative_mae # relative l1 norm

train_frac: 0.6
test_frac: 0.1
stride: 5
# Already downsampled 256x512 -> 128x256 at fetch time
# (prepare_shear_flow_dataset.py --ds 2) -- no further downsampling here.
ds: 1


#
exp_name: exp_shear_flow_Re5e4_Sc1e0
name_weigths_to_load: null
