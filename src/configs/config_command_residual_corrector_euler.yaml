########## RESIDUAL CORRECTOR (euler_multi_quadrants_openBC, gamma=1.4, delta emulator) ##########

seed: 42
device: cuda

# Trained on the ACTUAL rollout drift of fno_euler_gamma1.4_delta (cf.
# training/generate_euler_correction_data.py, run separately beforehand to
# produce these two files -- this config does NOT run the emulator itself),
# not synthetic Gaussian noise like diffusion_euler_gamma1.4 -- see
# training/ResidualCorrectorModel.py's docstring for why that one couldn't
# stabilize this emulator's delta-mode divergence.
#
# train_correction_file: rollouts from the emulator's OWN train_files
# (already seen by the emulator -- fine, the corrector is learning THIS
# emulator's error behavior). val_correction_file: rollouts from the
# emulator's OWN val_traj_idx trajectories -- used here as this run's
# Tr/Te split (early stopping, overfitting check). The emulator's
# test_traj_idx trajectories are deliberately NEVER touched by either file
# -- reserved entirely for the final held-out rollout-correction check
# (evaluation/correction_eval_euler.py's residual-corrector counterpart).
exp_dir: euler_multi_quadrants_openBC
train_correction_file: euler_multi_quadrants_openBC/correction_data/train_rollouts.hdf5
val_correction_file: euler_multi_quadrants_openBC/correction_data/val_rollouts.hdf5
stride: 1
# Capped at 100, NOT the 300 the rollout files were generated with: each
# Euler trajectory only has ~101 native GT frames (T=1.5s at dt=0.015s), so
# there is no real GT to pair a prediction against beyond step 100 -- the
# emulator itself only starts genuinely diverging around step ~150-300
# (energy blow-up), well past what any (corrupted, true) pair can ever
# cover here. LazyEulerCorrectionDataset auto-clamps to whatever the
# shortest referenced source trajectory actually supports regardless of
# this value (with a printed warning) -- this only restricts which steps
# are DRAWN FROM, unrelated to what the classifier head predicts (below).
max_step: 100

# How many buckets of ACTUAL measured relative error (corrupted vs true)
# the classifier head predicts -- NOT a rollout-step count (an earlier
# version of this design used raw step index, but that isn't
# trajectory-independent: caught during review -- one trajectory can be
# badly drifted by step 50 while another is clean at step 90, so the same
# step label meant very different real corruption levels). Log-spaced bins
# from 1e-3 to 2.0 relative error (cf. LazyEulerCorrectionDataset's
# error_bin_edges) -- this is the actual analogue of a diffusion timestep.
# NOTE for evaluation: correction_eval_euler.py's --s_init default (7) was
# calibrated for OTHER correctors' scales (diffusion timesteps out of
# ~1000, or the old raw-step scale out of 100) -- on this log-binned scale,
# bin 7 corresponds to a tiny ~0.2% relative error, far too sensitive. Pick
# --s_init empirically against this run's own error_bin_edges (e.g. the
# bin containing 0.05-0.1 relative error is a more reasonable "worth
# correcting" threshold to start from).
n_error_bins: 100

n_channels: 4  # energy, density, momentum_x, momentum_y

# Same "smaller-A" scale as fno_euler_gamma1.4_delta (config_command_emul_euler_delta.yaml)
# -- this corrector targets that specific emulator, no reason to scale up.
# layers_mlp[0]/[-1] must equal width (32); class_mlp_layers[0] must equal
# 2*width (64, avg+max pool concatenated, cf. fno_2D_classifier.py).
modes_x: 24
modes_y: 24
kernel_size: 1
n_layers: 4
width: 32
hidden_proj: 64
mlp: true
layers_mlp: [32, 64, 32]
padding: 16
class_mlp_layers: [64, 128, 100]  # last entry must equal n_error_bins

# Training parameters. patience is not optional here -- this run's whole
# point is verifying the corrector doesn't just overfit the specific
# trajectories/steps it was shown (cf. the Tr/Te gap in logs/metrics.csv).
num_epochs: 200
patience: 20
min_delta: 1.0e-6
batch_size: 8
num_workers: 2
loss_score: mse
loss_cat: cross_entropy
optimizer:
  type: adam
  lr: 0.0001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 200
  eta_min: 0.000001

# Weighted toward the regression (residual) loss -- the classifier head
# only needs to be good enough to gate whether correction fires (mirrors
# maybe_correct's s_init threshold), the actual correction quality is
# entirely the regression head's job.
lambda_c: 0.2

#
exp_name: residual_corrector_euler_gamma1.4_delta
name_weights_to_load: null
