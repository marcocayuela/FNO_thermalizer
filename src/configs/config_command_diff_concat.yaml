########## DIFFUSION (Re-conditioned, concat) ##########

seed: 42
device: cuda

# Experiment -- reuses Parameterized_Neural_Operator's kolmogorov_parametric
# dataset (Re<X>/train_traj/*.h5), not thermalizer's own single-Re kolmogorov/Re90.
exp_dir: kolmogorov_parametric
re_values: [20, 30, 40, 50, 60, 70, 80, 90]
model_type: fno_concat  # cf. training/diffusion_model_factory.py
input_dim: 2
output_dim: 2
n_dim: 2
domain_size:
  - 1
  - 1
ratio: 1
k_max_x: 12
k_max_y: 12
l: 1

# Model parameters
n_fourier_layer: 3
width: 32
hidden_proj: 64
mlp: true
layers_mlp: [32,64,32]
timesteps: 1000
# class_mlp_layers left unset on purpose: FNO2D_classifier_concat's default
# ([2*width+1, 4*width, n_cat]) already accounts for the extra Re scalar
# concatenated to the pooled features -- the base config's [64,128,1000]
# (2*width, sized for the unconditioned classifier) would be off by one.
noise_sampling_coeff: 0.3


# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 128
num_workers: 2
loss_score: mse
loss_cat: cross_entropy
optimizer:
  type: adam
  lr: 0.0001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001


lambda_c: 0.3
stride: 5
ds: 2


#
exp_name: diffusion_concat_re20-90
name_weigths_to_load: null
