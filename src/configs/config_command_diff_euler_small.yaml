########## DIFFUSION (euler_multi_quadrants_openBC, gamma=1.4 "Dry_air") -- SMALL variant ##########

seed: 42
device: cuda

# Same data/experiment family as config_command_diff_euler.yaml, much
# smaller backbone -- width and modes roughly halved, one fewer Fourier
# layer, batch size x4. Rough param-count scaling: the FNO weight tensors
# scale ~width^2 * modes_x * modes_y * n_layers, so (24/48)^2 * (16/24)^2 *
# (3/4) ~= 0.08x the backbone weights of the full-size run -- an order of
# magnitude fewer parameters, should be noticeably faster per epoch on top
# of the larger batch cutting the number of steps/epoch by 4x.
exp_dir: euler_multi_quadrants_openBC
train_files:
  - euler_multi_quadrants_openBC/data/train/euler_multi_quadrants_openBC_gamma_1.4_Dry_air_20_chunk_0.hdf5
  - euler_multi_quadrants_openBC/data/train/euler_multi_quadrants_openBC_gamma_1.4_Dry_air_20_chunk_40.hdf5
stride: 1

n_channels: 4  # energy, density, momentum_x, momentum_y
# field_mean/field_std left unset -- load_euler_diffusion_data() computes
# them itself if absent (same as config_command_diff_euler.yaml).

modes_x: 16   # was 24
modes_y: 16   # was 24
kernel_size: 1
n_layers: 3   # was 4
width: 24     # was 48
hidden_proj: 48   # was 96 -- kept at 2*width, same ratio as the full-size run
mlp: true
layers_mlp: [24, 48, 24]   # must equal width at [0]/[-1] -- same 2*width middle ratio as before
padding: 16
timesteps: 1000
class_mlp_layers: [48, 96, 1000]   # 2*width, 4*width, n_cat -- FNO2D_classifier's own default formula for the new width
noise_sampling_coeff: 0.3

# Fresh run (no name_weights_to_load), full epoch budget rather than a
# resume's remaining-budget trick.
num_epochs: 300
batch_size: 16   # was 4 -- the 512x512x4 fields at batch=4 were very
                 # likely leaving the GPU underused; try this first, raise
                 # further if nvidia-smi still shows headroom and memory
                 # allows it.
num_workers: 2
loss_score: mse
loss_cat: cross_entropy
optimizer:
  type: adam
  lr: 0.0001   # left unchanged despite the larger batch -- consider raising
               # towards ~0.0002-0.0004 (linear scaling rule for the 4x
               # batch) only if training looks stable but slow to converge;
               # not changed here since wd=100 was tuned for the original
               # batch size and bumping both at once makes it hard to tell
               # which change did what.
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 300
  eta_min: 0.000001

lambda_c: 0.3

#
exp_name: diffusion_euler_gamma1.4_small
