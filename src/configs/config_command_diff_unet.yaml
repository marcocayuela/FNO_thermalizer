########## DIFFUSION U-NET ##########

seed: 42
device: cuda

# Experiment (ks, kolmogorov)
exp_dir: kolmogorov/Re90
input_dim: 2
output_dim: 2
n_dim: 2
domain_size:
  - 1
  - 1
ratio: 1

# Model parameters
depth: 3
base_width: 32
timesteps: 1000
# null => calcule automatiquement [2*bottleneck_ch, 4*bottleneck_ch, timesteps]
# (bottleneck_ch = base_width * 2**depth = 256 ici, pas width comme pour FNO)
class_mlp_layers: null
noise_sampling_coeff: 0.3

# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 128
num_workers: 2
loss_score: mse
loss_cat: cross_entropy
optimizer:
  type: adam
  lr: 0.0001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001

lambda_c: 0.3
stride: 5
ds: 2
patience: 10
min_delta: 1.0e-08

#
exp_name: diffusion_unet_RE90
name_weigths_to_load: null
