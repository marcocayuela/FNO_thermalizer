########### HYPER-NU EMULATOR (KS equation, nu in [0.3, 1.5]) #############
# Single FNO1D_hyper (fno/fno_1D_hyper.py) trained across several
# Kuramoto-Sivashinsky viscosities at once -- the nu-conditioned counterpart
# of config_command_emul_ks.yaml's mono-nu FNO1D (nu=0.35 only). Direct
# 1D port of Parameterized_Neural_Operator's hyper-R FNO2D (the spectral
# weight R parameterized by the physical parameter via a learned basis
# mixture), applied to KS's nu instead of Kolmogorov flow's Reynolds number.

seed: 42
device: cuda

# Data: KS_equation/nu<X>/{train_traj,test_traj}/sim<N>.h5 (h5 key "state"),
# generated by KS_equation/1-D_periodic_Kuramoto_Sivashinsky_equation/
# generate_ks_dataset.py -- one call per nu value below, 8 train + 2 test
# trajectories each (l=22, tf=150, mx=1024, nt=2000, n_harmonics=4,
# transient_frac=0.1).
exp_dir: KS_equation
nu_values: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]

input_dim: 1
output_dim: 1
k_max: 32
l: 1

# Model parameters -- same width/depth/hidden_proj/layers_mlp as the
# mono-nu template (config_command_emul_ks.yaml); n_basis/param_* control
# the hyper-R mechanism itself (cf. fno_1D_hyper.py::HyperIntegralKernel1D,
# common/param_conditioning.py::ParamEncoder).
n_fourier_layer: 3
width: 32
hidden_proj: 64
mlp: true
layers_mlp: [32, 64, 32]
tau: 0.00001

n_basis: 4
param_embed_dim: 32
param_hidden_dim: 64
param_encoder_layers: 2
param_log_transform: true
# param_mean/param_std are NOT set here -- FNOTrainingKS1DHyper computes
# them itself from nu_values (log(nu) mean/std, cf. DatasetManagerMultiNuKS1D)
# and passes them into the model, same convention as DatasetManagerMultiRe.

# Training parameters
num_epochs: 500
seq_length: 5
batch_size: 128
num_workers: 2
loss_fn: mse
optimizer:
  type: adam
  lr: 0.001
  wd: 100.
scheduler:
  name: cosine_annealing
  T_max: 500
  eta_min: 0.00001
metrics:
  - rmse
  - mae
  - relative_rmse
  - relative_mae

train_frac: 0.7
test_frac: 0.1
stride: 5
ds: 1
ratio: 1

#
exp_name: fno_ks_hyper_nu
name_weights_to_load: null
