########### OPERATOR IDENTIFICATION (KS equation, one FNO1D per nu) #############
# Reproduces /Users/marco/Documents/PhD/KS_equation/Operator_Identification.ipynb:
# trains one FNO1D per nu to map an instantaneous state u(.,t) directly onto
# the material derivative Du/Dt(.,t) (the KS right-hand side itself),
# instead of an autoregressive next-step emulator. Hyperparameters below
# (modes, width, epochs, lr, StepLR, L1 loss, batch_size) match that
# notebook's own choices exactly, for a faithful reproduction; the main
# deliberate difference is training at full spatial resolution (no
# "grid_encoding" downsampling to 50 points -- cf. ks_operator_dataset.py's
# own docstring for why).

seed: 42
device: cuda

exp_dir: KS_equation
nu_values: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]

# Model -- same modes/width/3-layer depth as the notebook's FNO1d.
k_max: 16
width: 16
n_fourier_layer: 3
l: 1
hidden_proj: 32

# Training -- same as the notebook's train() call.
num_epochs: 250
batch_size: 20
num_workers: 2
loss_fn: l1
optimizer:
  type: adam
  lr: 0.001
scheduler:
  step_size: 500
  gamma: 0.99

train_frac: 0.7
test_frac: 0.3
ds: 1

#
exp_name: fno_ks_operator
